name: New device support
description: Ask for an Aqara device to be added, or contribute the resource ids for one.
labels:
  - device-support
  - triage
body:
  - type: markdown
    attributes:
      value: |
        This integration reads values the Aqara cloud serves but the hub does not
        serve locally. Adding a device means knowing which legacy resource ids
        carry those values, which is specific to the model.

        If you only know the model, open this anyway — but it may sit until
        someone with the hardware can capture the ids.

  - type: input
    id: model
    attributes:
      label: Aqara model string
      description: As the Aqara cloud reports it, e.g. `lumi.plug.aeu002`.
      placeholder: lumi.
    validations:
      required: true

  - type: input
    id: product
    attributes:
      label: Product name
      placeholder: Wall Outlet H2 (EU)
    validations:
      required: true

  - type: textarea
    id: values
    attributes:
      label: Which values are missing?
      description: >
        What does the Aqara app show that Home Assistant does not? Be specific
        about units and whether the value is a current reading or a period
        total.
      placeholder: |
        Per-socket power in W, and energy today / this month in Wh.
    validations:
      required: true

  - type: textarea
    id: resource_ids
    attributes:
      label: Resource ids (if you have them)
      description: >
        The keys the app requests from
        `/app/v1.0/lumi/app/view/data/query/new` for this device, and what each
        one is. Plain ids such as `0.17.85` are current values; keys like
        `1d_0_0.17.85` and `month_0_0.17.85` are today and this-month totals.
        Say how you captured them.
      placeholder: |
        8.0.2293 - socket 1 power (W)
        0.17.85  - socket 1 energy (Wh)
        Captured with a proxy while opening the socket's energy page.
      render: text

  - type: dropdown
    id: testing
    attributes:
      label: Can you test a change on this hardware?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
