name: Bug report
description: Report something not working as expected in AqaraLink.
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        This integration only reads values from the Aqara cloud. If the problem
        is with locally-pushed state, device control, or cameras, it belongs to
        [Aqara-LANLink](https://github.com/absent42/Aqara-LANLink) rather than
        here.

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AqaraLink version
      description: From HACS, or the `version` field in `manifest.json`.
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2025.4.0"
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: Aqara region
      placeholder: EU
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Device model
      description: The Aqara model string the problem is about, if it is one device.
      placeholder: lumi.plug.aeu002

  - type: dropdown
    id: lanlink
    attributes:
      label: Is Aqara-LANLink also installed?
      description: >
        AqaraLink attaches its sensors to that integration's device cards when
        it is present, so it is worth knowing either way.
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from Home Assistant's log. Enable debug with:

        ```yaml
        logger:
          logs:
            custom_components.aqaralink: debug
        ```

        Redact your token and user id before pasting.
      render: text
